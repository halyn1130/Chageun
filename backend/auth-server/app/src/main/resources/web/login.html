<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>차근 · 로그인</title>
  <link rel="icon" type="image/png" href="/static/chageun-logo.png" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="container">
  <div class="brand"><img src="/static/chageun-logo.png" alt="차근 로고"><strong>차근</strong></div>
  <h1>로그인</h1>

  <!-- ✅ Keep the form, but JS intercepts submit and processes via fetch -->
  <form id="loginForm" method="POST" action="/api/login">
    <label>아이디
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label>비밀번호
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <button type="submit">로그인</button>
  </form>

  <p id="msg" style="color:#c00; margin-top:10px;"></p>

  <p>처음이신가요? <a href="/signup">계정 만들기</a></p>
</div>

<script>
(function () {
  const form = document.getElementById("loginForm");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";

    const fd = new FormData(form);
    const body = new URLSearchParams();
    for (const [k, v] of fd.entries()) body.append(k, v);

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
        credentials: "include",
      });

      const data = await res.json().catch(() => null);

      if (!res.ok) {
        msg.textContent = (data && data.error) ? data.error : ("Login error (HTTP " + res.status + ")");
        return;
      }

      // 테스트용 페이지: 토큰을 저장하고 결과만 보여 준다 (실제 화면은 Vue 프론트)
      localStorage.setItem("access_token", data.access_token);
      msg.textContent = "로그인 성공 · access_token 저장됨";
    } catch (err) {
      console.error(err);
      msg.textContent = "Login failed due to a network error.";
    }
  });
})();
</script>

<!-- Recommended to remove app.js as it may interfere with redirect -->
<!-- <script src="/static/app.js"></script> -->
</body>
</html>
