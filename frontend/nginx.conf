# vite.config.js의 개발 서버 프록시와 같은 경로 규칙 — /auth · /api · /voice 접두사를 떼고 compose 내부 서비스로 넘긴다
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # 음성 업로드 (STT)

    location /auth/ {
        proxy_pass http://auth-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api-server:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;    # RAG 답변 대기
    }

    location /voice/ {
        proxy_pass http://voice-ai:8008/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;    # STT · TTS 대기
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
